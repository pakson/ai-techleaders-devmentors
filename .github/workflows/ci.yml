# Definition-of-done gate for every pull request (spec: .ai/specs/2026-10-19-ci-pipeline.md).
# Each job is one status check; all of them must be green on the PR's latest commit before merging.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit (100% coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # Fails when coverage of packages/*/src drops below 100%.
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
        env: { NODE_ENV: production }

  integration:
    name: integration (Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      # No TEST_DATABASE_URL: the global setup starts postgres:17 with Testcontainers (Docker).
      - run: npm run test:int

  e2e:
    name: e2e (agent-browser + Testcontainers PostgreSQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npx agent-browser install --with-deps
      - run: npm run build
        env: { NODE_ENV: production }
      # The app starts with `next start` against a Testcontainers database and is driven by agent-browser.
      - run: npm run test:e2e
